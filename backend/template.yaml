AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Food at Peace — Claude vision proxy. Holds the Anthropic API key server-side
  (in SSM Parameter Store) so it never ships inside the app.

Parameters:
  Model:
    Type: String
    Default: claude-sonnet-4-6
    Description: Anthropic model used for photo analysis.
  AnthropicKeyParam:
    Type: String
    Default: /food-at-peace/anthropic-api-key
    Description: SSM SecureString parameter that holds the Anthropic API key.
  AppTokenParam:
    Type: String
    Default: /food-at-peace/app-token
    Description: SSM SecureString parameter that holds the shared app token.
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin. Tighten to your web origin for production.
  AppleClientId:
    Type: String
    Default: ""
    Description: >
      Bundle id the iOS app signs in under = the Apple identity token's audience
      (e.g. com.yourcompany.foodatpeace). Required for Sign in with Apple.
  SessionKeyParam:
    Type: String
    Default: /food-at-peace/session-signing-key
    Description: SSM SecureString parameter holding the HS256 session-token signing key.
  SessionTtlDays:
    Type: Number
    Default: 60
    Description: How long an issued session token stays valid (days).

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512

Resources:
  VisionApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowOrigin
        AllowHeaders:
          - content-type
          - x-app-token
          - authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      # Stage throttling caps the blast radius (and Anthropic spend) if the
      # endpoint is hammered.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  VisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      # NOTE: no ReservedConcurrentExecutions here. New AWS accounts start with a Lambda
      # concurrency limit of ~10, and reserving any amount would push unreserved capacity
      # below AWS's minimum of 10 (the function fails to create). The account-wide limit
      # plus the API Gateway throttling below already cap the blast radius. Once your
      # account concurrency limit is raised, you can add e.g.
      # `ReservedConcurrentExecutions: 5` for a hard per-function cap.
      Environment:
        Variables:
          MODEL: !Ref Model
          ANTHROPIC_KEY_PARAM: !Ref AnthropicKeyParam
          APP_TOKEN_PARAM: !Ref AppTokenParam
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AppTokenParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              # Scoped to decryption performed *via SSM only* — least privilege
              # for the AWS-managed aws/ssm key.
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /analyze
            Method: POST

  # Sign in with Apple -> app session token. Verifies the Apple identity token
  # against Apple's public JWKS and mints an HS256 session token (signed with the
  # SSM session key) that the app sends on every /sync call.
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: auth.handler
      Environment:
        Variables:
          APPLE_CLIENT_ID: !Ref AppleClientId
          SESSION_KEY_PARAM: !Ref SessionKeyParam
          SESSION_TTL_DAYS: !Ref SessionTtlDays
      Policies:
        - Statement:
            - Sid: ReadSessionKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        AppleSignIn:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /auth/apple
            Method: POST

  # Per-user data: one item per record. PK = userId, SK = recordType#id
  # (food#<id>, weight#<id>, or the singleton "profile").
  SyncTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # Authenticated bidirectional delta sync (food / weight / profile). Verifies
  # the app session token (HS256, no JWKS) then reads/writes the user's items.
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: sync.handler
      Environment:
        Variables:
          SYNC_TABLE: !Ref SyncTable
          SESSION_KEY_PARAM: !Ref SessionKeyParam
      Policies:
        - Statement:
            - Sid: ReadWriteUserData
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt SyncTable.Arn
            - Sid: ReadSessionKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Sync:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /sync
            Method: POST

  # In-app account deletion (App Store Guideline 5.1.1(v)). Verifies the app
  # session token, then removes every row the user owns in the sync table —
  # all the server-side data we hold for them.
  AccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: account.handler
      Environment:
        Variables:
          SYNC_TABLE: !Ref SyncTable
          SESSION_KEY_PARAM: !Ref SessionKeyParam
      Policies:
        - Statement:
            - Sid: DeleteUserData
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt SyncTable.Arn
            - Sid: ReadSessionKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        DeleteAccount:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /account/delete
            Method: POST

  # Aggregate, non-PII product counters for the owner dashboard. One row of
  # lifetime totals (pk="counter") plus one row per day (pk="day#<date>").
  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # Owner analytics: POST /event increments counters; GET /metrics reads them
  # back in the AppMetrics shape. Guarded by the shared app token.
  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: metrics.handler
      Environment:
        Variables:
          METRICS_TABLE: !Ref MetricsTable
          APP_TOKEN_PARAM: !Ref AppTokenParam
      Policies:
        - Statement:
            - Sid: ReadWriteMetrics
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt MetricsTable.Arn
            - Sid: ReadAppToken
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AppTokenParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Emit:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /event
            Method: POST
        Read:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /metrics
            Method: GET

  # Circle of Food: handle directory + friendship edges. PK/SK single-table.
  CircleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # Friend graph (register/invite/respond/remove/list). Session-token auth.
  # Reads the sync table (read-only) to compute a connected friend's trend.
  CircleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: circle.handler
      Environment:
        Variables:
          CIRCLE_TABLE: !Ref CircleTable
          SYNC_TABLE: !Ref SyncTable
          SESSION_KEY_PARAM: !Ref SessionKeyParam
      Policies:
        - Statement:
            - Sid: ReadWriteCircle
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt CircleTable.Arn
            - Sid: ReadFriendSyncData
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt SyncTable.Arn
            - Sid: ReadSessionKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/register
            Method: POST
        Invite:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/invite
            Method: POST
        Respond:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/respond
            Method: POST
        Remove:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/remove
            Method: POST
        ListCircle:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/list
            Method: GET

Outputs:
  ProxyBaseUrl:
    Description: >
      Base URL of the proxy. Pass this to the app as --dart-define=PROXY_BASE_URL
      (the app POSTs to <base>/analyze).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com
  AnalyzeUrl:
    Description: Full analyze endpoint (for curl / sanity checks).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com/analyze
  AppleSignInUrl:
    Description: Sign in with Apple endpoint (POST the Apple identityToken here).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com/auth/apple
  SyncUrl:
    Description: Authenticated delta-sync endpoint (Authorization Bearer session token).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com/sync
  AccountDeleteUrl:
    Description: In-app account deletion endpoint (Authorization Bearer session token).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com/account/delete
