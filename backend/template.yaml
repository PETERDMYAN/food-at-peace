AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Food at Peace — Claude vision proxy. Holds the Anthropic API key server-side
  (in SSM Parameter Store) so it never ships inside the app.

Parameters:
  Model:
    Type: String
    Default: claude-sonnet-4-6
    Description: Anthropic model used for photo analysis.
  AnthropicKeyParam:
    Type: String
    Default: /food-at-peace/anthropic-api-key
    Description: SSM SecureString parameter that holds the Anthropic API key.
  AppTokenParam:
    Type: String
    Default: /food-at-peace/app-token
    Description: SSM SecureString parameter that holds the shared app token.
  MetricsTokenParam:
    Type: String
    Default: /food-at-peace/metrics-token
    Description: >
      SSM SecureString holding the read-only token for the standalone web
      metrics dashboard (GET /metrics). Separate from the app token so the
      shared /analyze secret never has to live in a browser.
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Allowed CORS origin. Tighten to your web origin for production.
  AppleClientId:
    Type: String
    Default: ""
    Description: >
      Bundle id the iOS app signs in under = the Apple identity token's audience
      (e.g. com.yourcompany.foodatpeace). Required for Sign in with Apple.
  SessionKeyParam:
    Type: String
    Default: /food-at-peace/session-signing-key
    Description: SSM SecureString parameter holding the HS256 session-token signing key.
  IapSecretParam:
    Type: String
    Default: /food-at-peace/iap-shared-secret
    Description: SSM SecureString parameter holding the App Store shared secret (IAP receipt validation).
  ApnsKeyParam:
    Type: String
    Default: /food-at-peace/apns-key
    Description: SSM SecureString parameter holding the APNs .p8 auth key.
  ApnsKeyIdParam:
    Type: String
    Default: /food-at-peace/apns-key-id
    Description: SSM parameter holding the 10-char APNs key id.
  ApnsTeamId:
    Type: String
    Default: GJB4AB92L4
    Description: Apple Developer team id (APNs provider-JWT issuer).
  ApnsBundleId:
    Type: String
    Default: com.foodatpeace.foodAtPeace
    Description: App bundle id (used as the APNs topic).
  SessionTtlDays:
    Type: Number
    Default: 60
    Description: How long an issued session token stays valid (days).

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512

Resources:
  VisionApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowOrigin
        AllowHeaders:
          - content-type
          - x-app-token
          - x-metrics-token
          - authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      # Stage throttling caps the blast radius (and Anthropic spend) if the
      # endpoint is hammered.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  VisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      # NOTE: no ReservedConcurrentExecutions here. New AWS accounts start with a Lambda
      # concurrency limit of ~10, and reserving any amount would push unreserved capacity
      # below AWS's minimum of 10 (the function fails to create). The account-wide limit
      # plus the API Gateway throttling below already cap the blast radius. Once your
      # account concurrency limit is raised, you can add e.g.
      # `ReservedConcurrentExecutions: 5` for a hard per-function cap.
      Environment:
        Variables:
          MODEL: !Ref Model
          ANTHROPIC_KEY_PARAM: !Ref AnthropicKeyParam
          APP_TOKEN_PARAM: !Ref AppTokenParam
      Policies:
        - Statement:
            - Sid: ReadSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AppTokenParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              # Scoped to decryption performed *via SSM only* — least privilege
              # for the AWS-managed aws/ssm key.
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /analyze
            Method: POST

  # Sign in with Apple -> app session token. Verifies the Apple identity token
  # against Apple's public JWKS and mints an HS256 session token (signed with the
  # SSM session key) that the app sends on every /sync call.
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: auth.handler
      Environment:
        Variables:
          APPLE_CLIENT_ID: !Ref AppleClientId
          SESSION_KEY_PARAM: !Ref SessionKeyParam
          SESSION_TTL_DAYS: !Ref SessionTtlDays
      Policies:
        - Statement:
            - Sid: ReadSessionKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        AppleSignIn:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /auth/apple
            Method: POST

  # Per-user data: one item per record. PK = userId, SK = recordType#id
  # (food#<id>, weight#<id>, or the singleton "profile").
  SyncTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # Authenticated bidirectional delta sync (food / weight / profile). Verifies
  # the app session token (HS256, no JWKS) then reads/writes the user's items.
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: sync.handler
      Environment:
        Variables:
          SYNC_TABLE: !Ref SyncTable
          SESSION_KEY_PARAM: !Ref SessionKeyParam
      Policies:
        - Statement:
            - Sid: ReadWriteUserData
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt SyncTable.Arn
            - Sid: ReadSessionKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Sync:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /sync
            Method: POST

  # Per-user Beans ledger (append-only). Keyed userId + sk(=txn id). Isolated
  # from SyncTable so it never touches the food/weight/profile sync contract.
  BeansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # Server-side Beans wallet: GET /beans pulls the ledger, POST /beans appends
  # (idempotent by txn id). Bearer session token, scoped to the account.
  BeansFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: beans.handler
      Environment:
        Variables:
          BEANS_TABLE: !Ref BeansTable
          SESSION_KEY_PARAM: !Ref SessionKeyParam
      Policies:
        - Statement:
            - Sid: ReadWriteBeans
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt BeansTable.Arn
            - Sid: ReadSessionKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        GetBeans:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /beans
            Method: GET
        PostBeans:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /beans
            Method: POST

  # Apple IAP receipt validation: POST /iap/validate verifies the receipt with
  # Apple (shared secret) and credits the Beans server-side (idempotent), into
  # the same BeansTable ledger. Bearer session token, scoped to the account.
  IapFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: iap.handler
      Environment:
        Variables:
          BEANS_TABLE: !Ref BeansTable
          SESSION_KEY_PARAM: !Ref SessionKeyParam
          IAP_SECRET_PARAM: !Ref IapSecretParam
          METRICS_TABLE: !Ref MetricsTable
      Policies:
        - Statement:
            - Sid: ReadWriteBeans
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt BeansTable.Arn
            - Sid: RecordRevenueMetric
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource:
                - !GetAtt MetricsTable.Arn
            - Sid: ReadSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${IapSecretParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        ValidateIap:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /iap/validate
            Method: POST

  # In-app account deletion (App Store Guideline 5.1.1(v)). Verifies the app
  # session token, then removes every row the user owns in the sync table —
  # all the server-side data we hold for them.
  AccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: account.handler
      Environment:
        Variables:
          SYNC_TABLE: !Ref SyncTable
          BEANS_TABLE: !Ref BeansTable
          SESSION_KEY_PARAM: !Ref SessionKeyParam
      Policies:
        - Statement:
            - Sid: DeleteUserData
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt SyncTable.Arn
                - !GetAtt BeansTable.Arn
            - Sid: ReadSessionKey
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        DeleteAccount:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /account/delete
            Method: POST

  # Aggregate, non-PII product counters for the owner dashboard. One row of
  # lifetime totals (pk="counter") plus one row per day (pk="day#<date>").
  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # Owner analytics: POST /event increments counters; GET /metrics reads them
  # back in the AppMetrics shape. Guarded by the shared app token.
  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: metrics.handler
      Environment:
        Variables:
          METRICS_TABLE: !Ref MetricsTable
          APP_TOKEN_PARAM: !Ref AppTokenParam
          METRICS_TOKEN_PARAM: !Ref MetricsTokenParam
      Policies:
        - Statement:
            - Sid: ReadWriteMetrics
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt MetricsTable.Arn
            - Sid: ReadAppToken
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AppTokenParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MetricsTokenParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Emit:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /event
            Method: POST
        Read:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /metrics
            Method: GET

  # Circle of Food: handle directory + friendship edges. PK/SK single-table.
  CircleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # Friend graph (register/invite/respond/remove/list). Session-token auth.
  # Reads the sync table (read-only) to compute a connected friend's trend.
  CircleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: circle.handler
      Environment:
        Variables:
          CIRCLE_TABLE: !Ref CircleTable
          SYNC_TABLE: !Ref SyncTable
          SESSION_KEY_PARAM: !Ref SessionKeyParam
          APNS_KEY_PARAM: !Ref ApnsKeyParam
          APNS_KEY_ID_PARAM: !Ref ApnsKeyIdParam
          APNS_TEAM_ID: !Ref ApnsTeamId
          APNS_BUNDLE_ID: !Ref ApnsBundleId
      Policies:
        - Statement:
            - Sid: ReadWriteCircle
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt CircleTable.Arn
            - Sid: ReadFriendSyncData
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt SyncTable.Arn
            - Sid: ReadSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApnsKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApnsKeyIdParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/register
            Method: POST
        RegisterDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/register-device
            Method: POST
        Invite:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/invite
            Method: POST
        Connect:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/connect
            Method: POST
        Respond:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/respond
            Method: POST
        Remove:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/remove
            Method: POST
        ListCircle:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/list
            Method: GET

  # Ephemeral photo storage for circle posts — objects auto-expire after 3 days.
  CirclePhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: expire-3-days
            Status: Enabled
            ExpirationInDays: 3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Circle photo posts + emoji reactions. DynamoDB TTL reaps rows after 3 days.
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Circle photo feed: post / feed / react. Session-token auth; reads CircleTable
  # for the friend graph + author/reactor names; photos in S3 (presigned reads).
  PostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: posts.handler
      Environment:
        Variables:
          POSTS_TABLE: !Ref PostsTable
          CIRCLE_TABLE: !Ref CircleTable
          PHOTOS_BUCKET: !Ref CirclePhotosBucket
          SESSION_KEY_PARAM: !Ref SessionKeyParam
          APNS_KEY_PARAM: !Ref ApnsKeyParam
          APNS_KEY_ID_PARAM: !Ref ApnsKeyIdParam
          APNS_TEAM_ID: !Ref ApnsTeamId
          APNS_BUNDLE_ID: !Ref ApnsBundleId
      Policies:
        - Statement:
            - Sid: ReadWritePosts
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt PostsTable.Arn
            - Sid: ReadCircle
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt CircleTable.Arn
            - Sid: PhotoStorage
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub ${CirclePhotosBucket.Arn}/*
            - Sid: ReadSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SessionKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApnsKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApnsKeyIdParam}
            - Sid: DecryptSecureStrings
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        CreatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/post
            Method: POST
        Feed:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/feed
            Method: GET
        React:
          Type: HttpApi
          Properties:
            ApiId: !Ref VisionApi
            Path: /circle/react
            Method: POST

Outputs:
  ProxyBaseUrl:
    Description: >
      Base URL of the proxy. Pass this to the app as --dart-define=PROXY_BASE_URL
      (the app POSTs to <base>/analyze).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com
  AnalyzeUrl:
    Description: Full analyze endpoint (for curl / sanity checks).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com/analyze
  AppleSignInUrl:
    Description: Sign in with Apple endpoint (POST the Apple identityToken here).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com/auth/apple
  SyncUrl:
    Description: Authenticated delta-sync endpoint (Authorization Bearer session token).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com/sync
  AccountDeleteUrl:
    Description: In-app account deletion endpoint (Authorization Bearer session token).
    Value: !Sub https://${VisionApi}.execute-api.${AWS::Region}.amazonaws.com/account/delete
