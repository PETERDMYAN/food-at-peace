<!doctype html>
<html id="html" lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Food at Peace</title>
<!-- iOS Safari Smart App Banner: shows "OPEN" if installed, "GET" (App Store) if not. -->
<meta name="apple-itunes-app" content="app-id=6777715561" />
<meta name="theme-color" content="#0E0B14" />
<meta name="description" content="Join my circle on Food at Peace." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 28px; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #1B1330 0%, #0E0B14 60%);
    color: #fff; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .logo {
    width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 22px; display: block;
    object-fit: cover; box-shadow: 0 14px 40px rgba(176, 107, 255, .35);
  }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; font-weight: 800; }
  .handle { font-size: 18px; font-weight: 700; color: #C9B8FF; margin: 0 0 14px; }
  .sub { color: #B4ABC8; font-size: 15px; line-height: 1.5; margin: 0 0 26px; }
  .btn {
    display: block; width: 100%; padding: 15px 18px; margin: 10px 0; border-radius: 16px;
    font-size: 16px; font-weight: 700; text-decoration: none; color: #fff;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
  }
  .btn.primary { background: linear-gradient(135deg, #7C83FF 0%, #C86BFF 100%); border: none; box-shadow: 0 10px 30px rgba(124, 131, 255, .35); }
  .foot { margin-top: 22px; color: #6E6685; font-size: 13px; }
  .foot a { color: #9B92B5; }

  /* ---- WeChat: bouncing pointer to the real ••• at the window's top-right ---- */
  .wx-top { position: fixed; top: 3px; right: 12px; z-index: 60; display: flex; flex-direction: column;
    align-items: flex-end; gap: 3px; animation: wxTopBounce 1.15s ease-in-out infinite; pointer-events: none; }
  .wx-top .tri { width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent;
    border-bottom: 16px solid #C9B8FF; margin-right: 7px; filter: drop-shadow(0 0 8px rgba(124,131,255,.95)); }
  .wx-top .lbl { background: linear-gradient(135deg, #7C83FF, #C86BFF); color: #fff; font-size: 12px;
    font-weight: 800; padding: 5px 11px; border-radius: 13px; white-space: nowrap; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
  @keyframes wxTopBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  /* ---- WeChat hand-off card (no fake menu — the real ••• lives top-right) ---- */
  .wechat { margin: 4px 0 0; padding: 18px; border-radius: 16px; text-align: left;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); }
  .wechat strong { display: block; margin-bottom: 6px; font-size: 16px; }
  .wechat p { margin: 0 0 14px; color: #B4ABC8; font-size: 14px; line-height: 1.5; }
  .wechat b { color: #fff; }
  /* The exact menu row to look for, shown as a static label (not a control) so
     nobody tries to tap it here — the real ••• is only at the window's top-right. */
  .wx-pillrow { display: flex; justify-content: center; }
  .wx-pill { display: inline-flex; align-items: center; max-width: 100%; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; padding: 11px 16px; border-radius: 12px;
    font-size: 15px; font-weight: 700; color: #fff; background: #241C36;
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  @media (prefers-reduced-motion: reduce) { .wx-top { animation: none; } }
</style>
</head>
<body>
  <div class="wx-top" id="wxTop" hidden>
    <div class="tri"></div>
    <div class="lbl" id="wxTopLabel"></div>
  </div>
  <main>
    <img class="logo" src="/icon.png" alt="Food at Peace" width="84" height="84" />
    <h1 id="title"></h1>
    <p class="handle" id="who"></p>
    <p class="sub" id="sub"></p>

    <a class="btn primary" id="open" href="https://apps.apple.com/app/id6777715561"></a>
    <a class="btn" id="download" href="https://apps.apple.com/app/id6777715561"></a>

    <div class="wechat" id="wechat" hidden>
      <strong id="wxTitle"></strong>
      <p id="wxBody"></p>
      <div class="wx-pillrow"><span class="wx-pill" id="wxMenuItem"></span></div>
    </div>

    <p class="foot"><span id="foot"></span> · <a id="footlink" href="https://apps.apple.com/app/id6777715561"></a></p>
  </main>

<script>
  (function () {
    // Recharge deep link: /recharge/<handle> has no S3 object, so it 404s into this
    // router. Hand it off to the standalone recharge page in handle mode. This MUST run
    // before the invite logic below, which would otherwise treat <handle> as an invite.
    var rparts = location.pathname.split('/').filter(Boolean);
    if (rparts[0] === 'recharge' && rparts[1]) {
      var rh = rparts[1].replace(/[^a-z0-9_]/gi, '').toLowerCase();
      if (rh) {
        // Preserve any existing query (e.g. ?base=<v2 url> for testing).
        var rqs = location.search ? (location.search + '&h=' + rh) : ('?h=' + rh);
        location.replace('/recharge' + rqs);
        return;
      }
    }

    var APPSTORE = 'https://apps.apple.com/app/id6777715561';
    var T = {
      en: {
        title: "Join my circle on Food at Peace",
        sub: "A calm calorie & macro tracker. Add me and we'll see each other's daily trends.",
        open: "Open in the app", download: "Download on the App Store",
        wxTitle: "Open in your browser to continue",
        wxBody: "WeChat can't open apps directly. Tap <b>•••</b> at the top-right, then <b>Open in default browser</b> — this page will then open the app (or the App Store).",
        menuItem: "Open in default browser", wxTop: "Tap ••• up here", foot: "iPhone only", footLink: "View on the App Store"
      },
      zh: {
        title: "加入我的 Food at Peace 圈子",
        sub: "一个简洁安心的卡路里与营养记录工具。加我，一起看彼此每天的饮食趋势。",
        open: "在 App 中打开", download: "前往 App Store 下载",
        wxTitle: "请在浏览器中打开",
        wxBody: "微信无法直接打开 App。请点击右上角 <b>•••</b>，选择 <b>用默认浏览器打开</b> — 然后即可打开 App（或前往 App Store）。",
        menuItem: "用默认浏览器打开", wxTop: "点击右上角 •••", foot: "仅限 iPhone", footLink: "在 App Store 查看"
      }
    };

    var ua = navigator.userAgent || '';
    var isWeChat = /MicroMessenger/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var navLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    // Follow the device language; inside WeChat always use Chinese.
    var lang = isWeChat ? 'zh' : (navLang.indexOf('zh') === 0 ? 'zh' : 'en');
    var t = T[lang];
    document.getElementById('html').setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');

    var parts = location.pathname.split('/').filter(Boolean);
    var idx = parts.indexOf('i');
    var raw = idx >= 0 ? (parts[idx + 1] || '') : (parts[parts.length - 1] || '');
    var handle = raw.replace(/[^a-z0-9_]/gi, '').toLowerCase();
    var scheme = handle ? ('foodatpeace://i/' + handle) : null;

    document.getElementById('title').textContent = t.title;
    document.getElementById('sub').textContent = t.sub;
    if (handle) document.getElementById('who').textContent = '@' + handle;
    var openBtn = document.getElementById('open');
    openBtn.textContent = t.open; if (scheme) openBtn.setAttribute('href', scheme);
    var dl = document.getElementById('download'); dl.textContent = t.download; dl.setAttribute('href', APPSTORE);
    document.getElementById('wxTitle').textContent = t.wxTitle;
    document.getElementById('wxBody').innerHTML = t.wxBody;
    document.getElementById('wxMenuItem').textContent = t.menuItem;
    document.getElementById('foot').textContent = t.foot;
    var fl = document.getElementById('footlink'); fl.textContent = t.footLink; fl.setAttribute('href', APPSTORE);

    if (isWeChat) {
      document.getElementById('wechat').hidden = false;
      document.getElementById('wxTopLabel').textContent = t.wxTop;
      document.getElementById('wxTop').hidden = false;
      openBtn.style.display = 'none';
      dl.style.display = 'none';
      return;
    }
    if (isIOS && scheme) {
      // Try to open the app; if we're still here ~1.4s later it isn't installed → App Store.
      var fallback = setTimeout(function () { location.href = APPSTORE; }, 1400);
      var cancel = function () { clearTimeout(fallback); };
      document.addEventListener('visibilitychange', function () { if (document.hidden) cancel(); });
      window.addEventListener('pagehide', cancel);
      window.addEventListener('blur', cancel);
      location.href = scheme;
    }
  })();
</script>
</body>
</html>
